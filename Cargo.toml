[workspace]
resolver = "2"
members = [
    "kernel",
    "drivers",
    "bootloader",
    "userland/lib-abi",
    "userland/init",
    "servers/vfs",
    "hal",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Clarigggz Team"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
